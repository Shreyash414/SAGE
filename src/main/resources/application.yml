server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aicte-compliance-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicte_platform_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:aicte_app_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aicte_123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sage:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${MINIO_BUCKET:sage-application-documents}
      access-key: ${MINIO_ACCESS_KEY:sage_minio_admin}
      secret-key: ${MINIO_SECRET_KEY:sage_minio_secret_2026}
      region: ${MINIO_REGION:us-east-1}
      auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
