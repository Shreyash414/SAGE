spring:
  datasource:
    url: jdbc:h2:mem:sage_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed

sage:
  security:
    jwt:
      secret: sage_test_jwt_secret_key_minimum_32_characters_for_hmac_sha256
      expiration-ms: 3600000
    internal:
      service-token: test_internal_service_secret_token_12345
  automation:
    service-url: http://localhost:8000
  workflow:
    enforce-document-completeness-on-submit: false

logging:
  level:
    root: WARN
    org.aicte.sage: INFO
    org.flywaydb: INFO
