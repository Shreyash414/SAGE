# ==============================================================================
# SAGE — Production Spring Boot Configuration Profile (prod)
# Fail-closed security, PostgreSQL connection pooling, and strict schema validation
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: framework

spring:
  application:
    name: sage-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sage_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:sage_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SageHikariCP-Prod
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

sage:
  documents:
    storage-dir: ${SAGE_STORAGE_DIR:/app/data/documents}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    internal:
      service-token: ${INTERNAL_SERVICE_TOKEN}
  automation:
    service-url: ${AUTOMATION_SERVICE_URL:http://automation:8000}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.aicte.sage: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
