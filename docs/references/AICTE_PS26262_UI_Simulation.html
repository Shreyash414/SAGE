document.addEventListener('change',e=>{if(e.target&&e.target.id==='statusFilter')filterVisibleRows();});
function filterVisibleRows(){const q=(searchQuery||'').toLowerCase();const status=(document.getElementById('statusFilter')?.value||'All').toLowerCase();document.querySelectorAll('.table-wrap table').forEach(tbl=>{let visible=0;tbl.querySelectorAll('tbody tr').forEach(tr=>{const txt=tr.innerText.toLowerCase();const searchOk=!q||txt.includes(q);const statusOk=status==='all'||txt.includes(status);const show=searchOk&&statusOk;tr.style.display=show?'':'none';if(show)visible++;});const foot=tbl.closest('.panel')?.querySelector('.panel-footer span');if(foot)foot.textContent='Showing '+visible+' matching rows';});}
function renderPageBodyOnly(){let pos=window.scrollY;const c=$('content');let html='';switch(currentPage){case'applications':html=applicationsPage();break;case'tasks':html=tasksPage();break;case'institutions':html=institutionsPage();break;case'evc':html=evcPage();break;case'compliance':html=compliancePage();break;case'documents':html=documentsPage();break;case'alerts':html=alertsPage();break;case'decisions':html=decisionsPage();break;case'adminUsers':html=adminUsersPage();break;case'notifications':html=notificationsPage();break;case'audit':html=auditPage();break;default:renderContent();return;}c.innerHTML=titlebar(currentPage)+html+`<div class="footer-note">Standalone HTML simulation · All records, dates and metrics are illustrative.</div>`;renderNav();window.scrollTo(0,pos);}
$('roleSelect').addEventListener('change',e=>{currentRole=e.target.value;const initials={'Regional Officer':'RO','Institution Representative':'IR','Scrutiny / Bureau Officer':'BO','EVC Coordinator':'EV','Compliance Reviewer':'CR','Senior Management':'SM','System Administrator':'SA'};$('user-avatar');document.querySelector('.user-avatar').textContent=initials[currentRole]||'DU';toast('Preview role changed to '+currentRole+'. Navigation remains open for design review.');if(currentPage==='dashboard')renderContent();});
$('menuToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
renderNav();renderContent();
</script>
</body>
</html>
