# ===================================================================
# Test Environment Configuration (Isolated In-Memory Database)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS evc\\;SET SCHEMA evc
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.schemas=evc
spring.flyway.default-schema=evc
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=evc
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Default API key for tests
evc.security.api-key=test-evc-secret-key-2026

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
