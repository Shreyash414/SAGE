spring.application.name=evc-scheduling-engine
server.port=${SERVER_PORT:8081}

# ===================================================================
# Database & Schema Isolation Configuration (Shared PostgreSQL)
# ===================================================================
# Targets a dedicated schema 'evc' within the shared SAGE PostgreSQL database
# on port 5432 to guarantee absolute isolation from SAGE-owned tables in 'public'.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicte_platform_db}?currentSchema=evc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:aicte_app_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:aicte_123}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.schemas=evc
spring.flyway.default-schema=evc
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=evc
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Security & SAGE Service-to-Service Authentication
# ===================================================================
# Shared API key for service-to-service communication with SAGE backend
evc.security.api-key=${EVC_API_KEY:evc-dev-secret-key-2026}

# ===================================================================
# OpenAPI / Swagger UI Documentation
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
